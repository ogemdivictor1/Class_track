<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<title>ClassTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --accent: #6c8eff;
    --accent2: #ff6c9d;
    --accent3: #6cffc8;
    --text: #e8eaf6;
    --text-muted: #8890b5;
    --success: #4cdf8e;
    --warning: #ffd166;
    --danger: #ff6b6b;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(108,142,255,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── LAYOUT ── */
  #app { display: flex; flex-direction: column; min-height: 100dvh; position: relative; z-index: 1; }

  .header {
    padding: 18px 20px 14px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(15,17,23,0.9);
    backdrop-filter: blur(20px);
    position: sticky; top: 0; z-index: 100;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .logo span { color: var(--accent3); -webkit-text-fill-color: var(--accent3); }

  .header-meta { font-size: 12px; color: var(--text-muted); text-align: right; line-height: 1.4; }
  .header-meta strong { color: var(--text); font-weight: 500; }

  .content { flex: 1; padding: 20px 16px 100px; max-width: 680px; margin: 0 auto; width: 100%; }

  /* ── BOTTOM NAV ── */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(15,17,23,0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    z-index: 100;
  }

  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 4px;
    background: none; border: none; color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px; font-weight: 500;
    cursor: pointer;
    transition: color 0.2s;
    -webkit-appearance: none;
  }

  .nav-btn svg { width: 22px; height: 22px; }

  .nav-btn.active { color: var(--accent); }
  .nav-btn.active svg path, .nav-btn.active svg rect, .nav-btn.active svg circle, .nav-btn.active svg polyline { stroke: var(--accent); }

  /* ── CARDS ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }

  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700;
    color: var(--text);
  }

  /* ── SECTION TITLES ── */
  .section-label {
    font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
    margin-top: 4px;
  }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    border: none; cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-appearance: none;
  }

  .btn:active { transform: scale(0.97); opacity: 0.85; }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: rgba(255,107,107,0.15); color: var(--danger); border: 1px solid rgba(255,107,107,0.3); }
  .btn-success { background: rgba(76,223,142,0.15); color: var(--success); border: 1px solid rgba(76,223,142,0.3); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-full { width: 100%; justify-content: center; }

  /* ── UPLOAD ZONE ── */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: rgba(108,142,255,0.05);
  }

  .upload-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
  }

  .upload-icon { font-size: 36px; margin-bottom: 10px; }
  .upload-title { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .upload-sub { font-size: 13px; color: var(--text-muted); }

  /* ── INPUTS ── */
  .input-group { margin-bottom: 12px; }
  .input-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 500; }

  input[type=text], input[type=number], select, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }

  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }

  select option { background: var(--surface2); }

  /* ── STUDENT LIST ── */
  .student-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    border: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .student-row:last-child { margin-bottom: 0; }
  .student-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 700;
    flex-shrink: 0;
    color: #fff;
  }

  .student-info { flex: 1; min-width: 0; }
  .student-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .student-reg { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .student-del {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; padding: 4px; flex-shrink: 0;
    transition: color 0.15s;
  }
  .student-del:hover { color: var(--danger); }

  /* ── TASKS ── */
  .task-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
  }

  .task-header {
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    transition: background 0.15s;
  }

  .task-header:hover { background: rgba(255,255,255,0.02); }

  .task-header-left { display: flex; align-items: center; gap: 10px; }

  .task-type-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }

  .task-name { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }
  .task-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .task-progress-ring { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
  .task-progress-ring svg { transform: rotate(-90deg); }
  .task-progress-ring .track { fill: none; stroke: var(--surface2); stroke-width: 3; }
  .task-progress-ring .fill { fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.4s; }
  .task-progress-ring .label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 10px; font-weight: 700;
  }

  .task-body { border-top: 1px solid var(--border); }

  /* Status pills inside task */
  .status-grid {
    display: grid;
    gap: 1px;
    background: var(--border);
  }

  .status-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
    transition: background 0.1s;
  }

  .status-row:hover { background: rgba(255,255,255,0.02); }
  .status-row:first-child { border-top: none; }

  .status-name { flex: 1; font-size: 13px; font-weight: 400; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status-reg { font-size: 11px; color: var(--text-muted); width: 90px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .status-select {
    width: auto;
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 20px;
    flex-shrink: 0;
    font-weight: 500;
    cursor: pointer;
  }

  /* Status colors */
  .s-pending   { background: rgba(136,144,181,0.15); border-color: rgba(136,144,181,0.3); color: var(--text-muted); }
  .s-done      { background: rgba(76,223,142,0.15); border-color: rgba(76,223,142,0.3); color: var(--success); }
  .s-absent    { background: rgba(255,107,107,0.15); border-color: rgba(255,107,107,0.3); color: var(--danger); }
  .s-partial   { background: rgba(255,209,102,0.15); border-color: rgba(255,209,102,0.3); color: var(--warning); }
  .s-excused   { background: rgba(108,142,255,0.15); border-color: rgba(108,142,255,0.3); color: var(--accent); }

  /* ── PILLS/BADGES ── */
  .badge {
    display: inline-flex; align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px; font-weight: 600;
    flex-shrink: 0;
  }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }

  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty h3 { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .empty p { font-size: 13px; line-height: 1.6; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: flex; align-items: flex-end;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px 20px max(20px, env(safe-area-inset-bottom));
    width: 100%;
    max-height: 92dvh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.4,0,.2,1);
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 4px;
    margin: 0 auto 18px;
  }

  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px; font-weight: 800;
    margin-bottom: 18px;
  }

  /* ── TABS ── */
  .tabs {
    display: flex; gap: 4px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-bottom: 18px;
  }

  .tab {
    flex: 1; padding: 9px 8px;
    border-radius: 6px;
    border: none; background: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .tab.active {
    background: var(--accent);
    color: #fff;
  }

  /* ── STATS ROW ── */
  .stats-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }

  .stat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 12px;
    text-align: center;
  }

  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label { font-size: 11px; color: var(--text-muted); }

  /* ── COLUMN MAP ── */
  .col-map { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .col-map-row { display: flex; align-items: center; gap: 10px; }
  .col-map-row label { font-size: 13px; width: 90px; flex-shrink: 0; color: var(--text-muted); }
  .col-map-row select { flex: 1; }

  /* ── FAB ── */
  .fab {
    position: fixed;
    bottom: max(72px, calc(72px + env(safe-area-inset-bottom)));
    right: 20px;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #fff;
    font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(108,142,255,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    z-index: 99;
  }

  .fab:active { transform: scale(0.93); }

  /* Search */
  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 10px 14px 10px 38px;
    outline: none;
    -webkit-appearance: none;
    margin-bottom: 14px;
  }

  .search-wrap { position: relative; }
  .search-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; stroke: var(--text-muted); pointer-events: none;
  }

  /* Filter chips */
  .filter-chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; scrollbar-width: none; }
  .filter-chips::-webkit-scrollbar { display: none; }
  .chip {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px; font-weight: 500;
    white-space: nowrap;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(108,142,255,0.1); }

  /* Toast */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 10px 18px;
    font-size: 13px; font-weight: 500;
    z-index: 300;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Collapsible chevron */
  .chevron { transition: transform 0.2s; width: 16px; height: 16px; stroke: var(--text-muted); flex-shrink: 0; }
  .chevron.open { transform: rotate(180deg); }

  /* scrollable task body */
  .task-body-inner { max-height: 320px; overflow-y: auto; }

  /* Quick actions */
  .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

  /* Page transitions */
  .page { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* Divider */
  .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="logo">Class<span>Track</span></div>
    <div class="header-meta" id="header-meta">No class loaded</div>
  </header>

  <main class="content" id="content"></main>

  <nav class="nav">
    <button class="nav-btn active" id="nav-roster" onclick="showPage('roster')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Roster
    </button>
    <button class="nav-btn" id="nav-tasks" onclick="showPage('tasks')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      Tasks
    </button>
    <button class="nav-btn" id="nav-overview" onclick="showPage('overview')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Overview
    </button>
  </nav>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="fabAction()" title="Add">+</button>

<!-- Modals -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div id="modal-content"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── STATE ──
let state = {
  className: '',
  students: [], // [{id, name, reg}]
  tasks: [],    // [{id, name, type, statuses, statusOptions, createdAt}]
};

const STORAGE_KEY = 'classtrack_v2';
const TYPE_COLORS = {
  payment: '#ffd166', assignment: '#6c8eff', attendance: '#6cffc8',
  submission: '#ff6c9d', custom: '#a78bfa'
};

const STATUS_PRESETS = {
  payment:    ['Pending', 'Paid', 'Partial', 'Excused'],
  assignment: ['Pending', 'Submitted', 'Missing', 'Late'],
  attendance: ['Present', 'Absent', 'Late', 'Excused'],
  submission: ['Pending', 'Submitted', 'Missing', 'Excused'],
  custom:     ['Pending', 'Done', 'Not Done', 'N/A'],
};

// ── PERSISTENCE ──
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (d) state = d;
  } catch(e) {}
}

// ── UTILS ──
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function initials(name) {
  const parts = name.trim().split(/\s+/);
  return parts.length >= 2 ? (parts[0][0]+parts[parts.length-1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
}

function statusClass(val, options) {
  const lv = (val||'').toLowerCase();
  if (['paid','present','submitted','done'].includes(lv)) return 's-done';
  if (['absent','missing','not done'].includes(lv)) return 's-absent';
  if (['partial','late'].includes(lv)) return 's-partial';
  if (['excused','n/a'].includes(lv)) return 's-excused';
  return 's-pending';
}

function updateHeaderMeta() {
  const el = document.getElementById('header-meta');
  if (!state.className && !state.students.length) {
    el.innerHTML = 'No class loaded';
  } else {
    el.innerHTML = `<strong>${state.className||'My Class'}</strong><br>${state.students.length} students`;
  }
}

// ── PAGES ──
let currentPage = 'roster';
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+page).classList.add('active');
  updateHeaderMeta();
  if (page === 'roster') renderRoster();
  else if (page === 'tasks') renderTasks();
  else if (page === 'overview') renderOverview();
}

// ── FAB ──
function fabAction() {
  if (currentPage === 'roster') openAddStudentModal();
  else if (currentPage === 'tasks') openNewTaskModal();
}

// ── ROSTER PAGE ──

        <div class="stat-box"><div class="stat-num">${state.tasks.length}</div><div class="stat-label">Tasks</div></div>
        <div class="stat-box"><div class="stat-num">${state.students.length ? Math.round(getOverallCompletion())+'%' : '—'}</div><div class="stat-label">Avg Done</div></div>
      </div>

      ${state.students.length ? `
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" type="text" placeholder="Search name or reg number…" value="${rosterSearch}"
          oninput="rosterSearch=this.value.toLowerCase();renderRoster()">

      ` : ''}

        </div>

          <div class="upload-icon">📋</div>
          <div class="upload-title">Drop your class list here</div>
          <div class="upload-sub">CSV or Excel (.xlsx, .xls) • Name + Reg number columns</div>
        </div>

        ${state.className ? `
        <div style="margin-top:12px">
          <label class="input-label">Class / Course Name</label>
          <input type="text" value="${escHtml(state.className)}" placeholder="e.g. CSC 301 – Computer Architecture"

          <label class="input-label">Or enter class name to start manually</label>

            oninput="state.className=this.value;save();updateHeaderMeta()">

      </div>
      ` : filtered.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <h3>No match</h3>
        <p>Try a different name or reg number.</p>

      ` : `

      ${filtered.map(s => `
        <div class="student-row">
          <div class="student-avatar">${initials(s.name)}</div>
          <div class="student-info">
            <div class="student-name">${escHtml(s.name)}</div>
            ${s.reg ? `<div class="student-reg">${escHtml(s.reg)}</div>` : ''}

          <button class="student-del" onclick="deleteStudent('${s.id}')" title="Remove">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>

function setupUploadDragDrop() {
  const zone = document.getElementById('upload-zone');
  if (!zone) return;
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) handleFileUpload(e.dataTransfer.files[0]);
  });
}

function handleFileUpload(file) {
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'csv') {
    Papa.parse(file, { header: true, skipEmptyLines: true, complete: r => processUploadedData(r.data, r.meta.fields) });
  } else if (['xlsx','xls'].includes(ext)) {
    const reader = new FileReader();
    reader.onload = e => {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, { defval: '' });
      const fields = data.length ? Object.keys(data[0]) : [];
      processUploadedData(data, fields);
    };
    reader.readAsArrayBuffer(file);
  } else {
    toast('Unsupported file type. Use CSV or Excel.');
  }
}

function processUploadedData(data, fields) {
  if (!data || !data.length) { toast('File appears empty.'); return; }
  // Try to auto-detect name and reg columns
  const nameKey = fields.find(f => /name/i.test(f)) || fields[0];
  const regKey  = fields.find(f => /reg|matric|id|number/i.test(f)) || fields[1] || '';
  // Show column mapping modal
  openColMapModal(data, fields, nameKey, regKey);
}

function openColMapModal(data, fields, nameKey, regKey) {
  const opts = fields.map(f => `<option value="${escAttr(f)}">${escHtml(f)}</option>`).join('');
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-title">Map Columns</div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">
      Found <strong style="color:var(--text)">${data.length} rows</strong>. Match your file columns to the fields below.
    </p>
    <div class="col-map">
      <div class="col-map-row">
        <label>Name column</label>
        <select id="cm-name">${fields.map(f=>`<option value="${escAttr(f)}" ${f===nameKey?'selected':''}>${escHtml(f)}</option>`).join('')}</select>
      </div>
      <div class="col-map-row">
        <label>Reg / ID column</label>
        <select id="cm-reg"><option value="">(none)</option>${fields.map(f=>`<option value="${escAttr(f)}" ${f===regKey?'selected':''}>${escHtml(f)}</option>`).join('')}</select>
      </div>
    </div>
    <div class="input-group">
      <label class="input-label">What to do with existing students</label>
      <select id="cm-mode">
        <option value="replace">Replace entire roster</option>
        <option value="merge">Merge (keep existing, add new)</option>
      </select>
    </div>
    <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="applyColMap(${JSON.stringify(data).replace(/"/g,'&quot;')})">Import ${data.length} students</button>
  `;
  openModal();
}

function applyColMap(data) {
  const nameKey = document.getElementById('cm-name').value;
  const regKey  = document.getElementById('cm-reg').value;
  const mode    = document.getElementById('cm-mode').value;
  const newStudents = data.map(row => ({
    id: uid(),
    name: String(row[nameKey]||'').trim(),
    reg: regKey ? String(row[regKey]||'').trim() : '',
  })).filter(s => s.name);

  if (mode === 'replace') {
    state.students = newStudents;
    // reset task statuses
    state.tasks.forEach(t => {
      t.statuses = {};
      newStudents.forEach(s => t.statuses[s.id] = t.statusOptions[0]);
    });
  } else {
    const existing = new Set(state.students.map(s => s.name.toLowerCase()));
    const toAdd = newStudents.filter(s => !existing.has(s.name.toLowerCase()));
    state.students.push(...toAdd);
    state.tasks.forEach(t => toAdd.forEach(s => { if (!t.statuses[s.id]) t.statuses[s.id] = t.statusOptions[0]; }));
    toast(`Added ${toAdd.length} new students.`);
  }

  save(); closeModal(); renderRoster();
  toast(`✓ Imported ${newStudents.length} students`);
}

function deleteStudent(id) {
  const student = state.students.find(s => s.id === id);
  if (!student) return;

  const ok = confirm(`Delete "${student.name}" from the roster?`);
  if (!ok) return;

  state.students = state.students.filter(s => s.id !== id);
  state.tasks.forEach(t => delete t.statuses[id]);

  save();
  renderRoster();

  toast('Student deleted');
}

function openAddStudentModal() {
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-title">Add Student</div>
    <div class="input-group">
      <label class="input-label">Full Name *</label>
      <input type="text" id="add-name" placeholder="e.g. Amara Okafor" autofocus>
    </div>
    <div class="input-group">
      <label class="input-label">Reg / Matric Number</label>
      <input type="text" id="add-reg" placeholder="e.g. CSC/2021/001">
    </div>
    <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="addStudent()">Add to Roster</button>
  `;
  openModal();
  setTimeout(() => document.getElementById('add-name')?.focus(), 300);
}

function addStudent() {
  const name = document.getElementById('add-name').value.trim();
  const reg  = document.getElementById('add-reg').value.trim();
  if (!name) { toast('Name is required.'); return; }
  const s = { id: uid(), name, reg };
  state.students.push(s);
  state.tasks.forEach(t => { t.statuses[s.id] = t.statusOptions[0]; });
  save(); closeModal(); renderRoster();
  toast(`✓ Added ${name}`);
}
// ── TASKS PAGE ──
let taskFilter = 'all';
let taskSearch = '';
function renderTasks() {
  const filtered = state.tasks.filter(t => taskFilter === 'all' || t.type === taskFilter);
  const types = [...new Set(state.tasks.map(t => t.type))];

  document.getElementById('content').innerHTML = `
    <div class="page">
      ${state.students.length === 0 ? `
      <div class="card" style="border-color:rgba(255,209,102,0.3);background:rgba(255,209,102,0.05)">
        <div style="font-size:13px;color:var(--warning)">⚠️ Add students to your roster first before creating tasks.</div>
      </div>
      ` : ''}

      <div class="filter-chips">
        <div class="chip ${taskFilter==='all'?'active':''}" onclick="taskFilter='all';renderTasks()">All</div>
        ${types.map(t => `<div class="chip ${taskFilter===t?'active':''}" onclick="taskFilter='${t}';renderTasks()">${capitalize(t)}</div>`).join('')}
      </div>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          class="search-input"
          type="text"
          placeholder="Search student in tasks..."
          value="${taskSearch}"
          oninput="
            taskSearch=this.value.toLowerCase();
            clearTimeout(window.taskSearchTimer);
            window.taskSearchTimer=setTimeout(()=>{
              renderTasks();
              const el=document.querySelector('.search-input');
              if(el){
                el.focus();
                el.setSelectionRange(el.value.length, el.value.length);
              }
            },120);
          "
        >
      </div>

      ${filtered.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">✅</div>
        <h3>No tasks yet</h3>
        <p>Tap <strong>+</strong> to create a task — payments, attendance, assignments, and more.</p>
      </div>
      ` : filtered.map(t => renderTaskCard(t)).join('')}
    </div>
  `;

  document.getElementById('fab').style.display = 'flex';
}

function buildPaymentSummaryBar(task) {
  if (task.type !== 'payment') return '';
  const price = task.price || 0;
  const paidCount = state.students.filter(s => ['paid'].includes((task.statuses[s.id]||task.statusOptions[0]).toLowerCase())).length;
  const collected = price * paidCount;
  return `<div style="padding:6px 14px 10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)">
    <span style="font-size:12px;color:var(--text-muted)">Price: <strong style="color:var(--warning)">₦${price.toLocaleString()}</strong></span>
    <span style="font-size:12px;color:var(--text-muted)">Paid: <strong style="color:var(--success)">${paidCount} student${paidCount!==1?'s':''}</strong></span>
    <span style="font-size:13px;font-family:'Syne',sans-serif;font-weight:700;color:var(--accent3)">Collected: ₦${collected.toLocaleString()}</span>
  </div>`;
}

function renderTaskCard(task) {
  const total = state.students.length;
  const doneStatuses = task.statusOptions.filter(s => ['paid','present','submitted','done'].includes(s.toLowerCase()));
  const done = state.students.filter(s => doneStatuses.includes(task.statuses[s.id]||task.statusOptions[0])).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  const circum = 2 * Math.PI * 17;
  const offset = circum - (pct / 100) * circum;
  const color = TYPE_COLORS[task.type] || TYPE_COLORS.custom;
  const isOpen = openTasks.has(task.id);

  return `
  <div class="task-card">
    <div class="task-header" onclick="toggleTask('${task.id}')">
      <div class="task-header-left">
        <div class="task-type-dot" style="background:${color}"></div>
        <div>
          <div class="task-name">${escHtml(task.name)}</div>
          <div class="task-meta">${capitalize(task.type)} · ${done}/${total} done</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="task-progress-ring">
          <svg width="40" height="40" viewBox="0 0 40 40">
            <circle class="track" cx="20" cy="20" r="17"/>
            <circle class="fill" cx="20" cy="20" r="17" stroke="${color}"
              stroke-dasharray="${circum}" stroke-dashoffset="${offset}"/>
          </svg>
          <div class="label" style="color:${color}">${pct}%</div>
        </div>
        <svg class="chevron ${isOpen?'open':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>

    ${isOpen ? `
    <div class="task-body">
      <div style="padding:10px 14px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="bulkSetStatus('${task.id}','${task.statusOptions[0]}')">Reset All</button>
        ${doneStatuses.length ? `<button class="btn btn-success btn-sm" onclick="bulkSetStatus('${task.id}','${doneStatuses[0]}')">Mark All Done</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="openExportModal('${task.id}')">Export</button>
        ${task.type === 'payment' ? `<button class="btn btn-ghost btn-sm" onclick="openEditPriceModal('${task.id}')">✏️ Edit Price</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick="deleteTask('${task.id}')">Delete Task</button>
      </div>
      ${buildPaymentSummaryBar(task)}
      <div class="task-body-inner">
        <div class="status-grid">
          ${state.students
            .filter(s =>
              !taskSearch ||
              s.name.toLowerCase().includes(taskSearch) ||
              (s.reg || '').toLowerCase().includes(taskSearch)
            )
            .map(s => {
            const val = task.statuses[s.id] || task.statusOptions[0];
            const sc = statusClass(val);
            return `
            <div class="status-row">
              <div class="status-name">${escHtml(s.name)}</div>
              <div class="status-reg">${escHtml(s.reg||'')}</div>
              <select class="status-select ${sc}" onchange="setStatus('${task.id}','${s.id}',this.value);this.className='status-select '+statusClass(this.value)">
                ${task.statusOptions.map(o => `<option value="${escAttr(o)}" ${o===val?'selected':''}>${escHtml(o)}</option>`).join('')}
              </select>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
    ` : ''}
  </div>`;
}

const openTasks = new Set();
function toggleTask(id) { openTasks.has(id) ? openTasks.delete(id) : openTasks.add(id); renderTasks(); }

function setStatus(taskId, studentId, val) {
  const task = state.tasks.find(t => t.id === taskId);
  if (task) { task.statuses[studentId] = val; save(); }
  // update stats in overview if visible
}

function bulkSetStatus(taskId, val) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  state.students.forEach(s => task.statuses[s.id] = val);
  save(); renderTasks();
}

function deleteTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;

  if (!confirm(`Delete task "${task.name}" and all its records?`)) return;
  state.tasks = state.tasks.filter(t => t.id !== id);
  openTasks.delete(id);
  save(); renderTasks();
  toast('Task deleted');
}

function openEditPriceModal(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-title">Edit Price — ${escHtml(task.name)}</div>
    <div class="input-group">
      <label class="input-label">Book / Item Price (₦)</label>
      <input type="number" id="edit-price-val" value="${task.price || 0}" min="0" step="0.01" autofocus>
    </div>
    <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="saveTaskPrice('${task.id}')">Save Price</button>
  `;
  openModal();
  setTimeout(() => document.getElementById('edit-price-val')?.focus(), 300);
}

function saveTaskPrice(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  const val = parseFloat(document.getElementById('edit-price-val').value) || 0;
  task.price = val;
  save();
  closeModal();
  renderTasks();
  toast(`Price updated to ₦${val.toLocaleString()}`);
}


function openNewTaskModal() {
  if (!state.students.length) { toast('Add students to the roster first.'); return; }
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-title">New Task</div>
    <div class="input-group">
      <label class="input-label">Task Name *</label>
      <input type="text" id="t-name" placeholder="e.g. Week 4 Assignment" autofocus>
    </div>
    <div class="input-group">
      <label class="input-label">Type</label>
      <select id="t-type" onchange="updateStatusPreview()">
        <option value="payment">💰 Payment</option>
        <option value="assignment">📝 Assignment</option>
        <option value="attendance">📅 Attendance</option>
        <option value="submission">📤 Submission</option>
        <option value="custom">⚡ Custom</option>
      </select>
    </div>
    <div class="input-group" id="t-price-group">
      <label class="input-label">Book / Item Price (₦)</label>
      <input type="number" id="t-price" placeholder="e.g. 5000" min="0" step="0.01">
    </div>
    <div class="input-group">
      <label class="input-label">Status Options (comma-separated)</label>
      <input type="text" id="t-statuses" value="${STATUS_PRESETS.payment.join(', ')}" placeholder="Pending, Paid, Partial">
      <div style="font-size:11px;color:var(--text-muted);margin-top:5px">First option is the default starting status.</div>
    </div>
    <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="createTask()">Create Task</button>
  `;
  openModal();
  setTimeout(() => document.getElementById('t-name')?.focus(), 300);
}

function updateStatusPreview() {
  const type = document.getElementById('t-type')?.value;
  if (type && STATUS_PRESETS[type]) {
    document.getElementById('t-statuses').value = STATUS_PRESETS[type].join(', ');
  }
  const priceGroup = document.getElementById('t-price-group');
  if (priceGroup) priceGroup.style.display = type === 'payment' ? '' : 'none';
}

function createTask() {
  const name = document.getElementById('t-name').value.trim();
  const type = document.getElementById('t-type').value;
  const rawStatuses = document.getElementById('t-statuses').value;
  if (!name) { toast('Task name is required.'); return; }
  const opts = rawStatuses.split(',').map(s=>s.trim()).filter(Boolean);
  if (!opts.length) { toast('Add at least one status option.'); return; }
  const statuses = {};
  state.students.forEach(s => statuses[s.id] = opts[0]);
  const priceVal = type === 'payment' ? parseFloat(document.getElementById('t-price')?.value || '0') || 0 : 0;
  const task = { id: uid(), name, type, statusOptions: opts, statuses, price: priceVal, createdAt: Date.now() };
  state.tasks.push(task);
  openTasks.add(task.id);
  save(); closeModal(); renderTasks();
  toast(`✓ Task "${name}" created`);
}
// ── OVERVIEW PAGE ──
function renderOverview() {
  document.getElementById('fab').style.display = 'none';
  const total = state.students.length;

  const paymentTasks = state.tasks.filter(t => t.type === 'payment');
  const grandTotal = paymentTasks.reduce((sum, t) => {
    const price = t.price || 0;
    const paidCount = state.students.filter(s => ['paid'].includes((t.statuses[s.id]||t.statusOptions[0]).toLowerCase())).length;
    return sum + price * paidCount;
  }, 0);

  if (!total) {
    document.getElementById('content').innerHTML = `
      <div class="page">
        <div class="empty"><div class="empty-icon">📊</div><h3>Nothing to overview yet</h3><p>Add students and create tasks to see analytics here.</p></div>
        <div class="quick-actions" style="margin-top:20px">
          <button class="btn btn-ghost" onclick="document.getElementById('backupImportInput').click()">📂 Restore Backup</button>
          <input id="backupImportInput" type="file" accept=".json" style="display:none" onchange="importBackup(event)">
        </div>
      </div>`;
    return;
  }

  const taskSummaries = state.tasks.map(t => {
    const doneOpts = t.statusOptions.filter(s => ['paid','present','submitted','done'].includes(s.toLowerCase()));
    const done = state.students.filter(s => doneOpts.includes(t.statuses[s.id]||t.statusOptions[0])).length;
    return { ...t, done, pct: total ? Math.round(done/total*100) : 0 };
  });

  const overall = taskSummaries.length ? Math.round(taskSummaries.reduce((a,t)=>a+t.pct,0)/taskSummaries.length) : 0;

  document.getElementById('content').innerHTML = `
    <div class="page">
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-label">Students</div></div>
        <div class="stat-box"><div class="stat-num">${state.tasks.length}</div><div class="stat-label">Tasks</div></div>
        <div class="stat-box"><div class="stat-num">${overall}%</div><div class="stat-label">Avg Done</div></div>
      </div>

      <div class="quick-actions" style="margin-bottom:18px">
        <button class="btn btn-ghost" onclick="exportBackup()">💾 Backup Data</button>

        <button class="btn btn-ghost" onclick="document.getElementById('backupImportInput').click()">
          📂 Restore Backup
        </button>

        <input
          id="backupImportInput"
          type="file"
          accept=".json"
          style="display:none"
          onchange="importBackup(event)"
        >
      </div>

      ${taskSummaries.length ? `
      <div class="section-label">Task Summary</div>
      ${taskSummaries.map(t => `
        <div class="card" style="padding:14px 16px;margin-bottom:10px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <div>
              <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700">${escHtml(t.name)}</div>
              <div style="font-size:11px;color:var(--text-muted)">${capitalize(t.type)}</div>
            </div>
            <div style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:${TYPE_COLORS[t.type]||TYPE_COLORS.custom}">${t.pct}%</div>
          </div>
          <div style="background:var(--surface2);border-radius:4px;height:6px;overflow:hidden">
            <div style="height:6px;border-radius:4px;background:${TYPE_COLORS[t.type]||TYPE_COLORS.custom};width:${t.pct}%;transition:width 0.5s"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text-muted)">
            <span>${t.done} done</span><span>${total - t.done} remaining</span>
          </div>
        </div>
      `).join('')}
      ` : `<div class="empty"><div class="empty-icon">📋</div><h3>No tasks yet</h3><p>Head to Tasks to create one.</p></div>`}

      ${paymentTasks.length ? `
      <hr class="divider">
      <div class="section-label">💰 Payment Summary</div>
      ${paymentTasks.map(t => {
        const price = t.price || 0;
        const paidCount = state.students.filter(s => ['paid'].includes((t.statuses[s.id]||t.statusOptions[0]).toLowerCase())).length;
        const collected = price * paidCount;
        return `<div class="card" style="padding:14px 16px;margin-bottom:10px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700">${escHtml(t.name)}</div>
            <div style="font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--accent3)">₦${collected.toLocaleString()}</div>
          </div>
          <div style="display:flex;gap:16px;font-size:12px;color:var(--text-muted)">
            <span>Price: <strong style="color:var(--warning)">₦${price.toLocaleString()}</strong></span>
            <span>Paid: <strong style="color:var(--success)">${paidCount}/${total}</strong></span>
          </div>
        </div>`;
      }).join('')}

      <div style="background:linear-gradient(135deg,rgba(108,142,255,0.12),rgba(255,108,157,0.08));border:1px solid rgba(108,255,200,0.25);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px">Grand Total Collected</div>
          <div style="font-size:11px;color:var(--text-muted)">Across all ${paymentTasks.length} payment task${paymentTasks.length!==1?'s':''}</div>
        </div>
        <div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--accent3)">₦${grandTotal.toLocaleString()}</div>
      </div>
      ` : ''}

      ${total > 0 ? `
      <hr class="divider">
      <div class="section-label">Student Status Matrix</div>
      <div style="overflow-x:auto;margin-bottom:20px">
        <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:${100+state.tasks.length*90}px">
          <thead>
            <tr>
              <th style="text-align:left;padding:8px 10px;color:var(--text-muted);font-weight:500;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;left:0">Student</th>
              ${state.tasks.map(t=>`<th style="text-align:center;padding:8px 6px;color:${TYPE_COLORS[t.type]||TYPE_COLORS.custom};font-family:'Syne',sans-serif;font-size:10px;font-weight:700;border-bottom:1px solid var(--border);max-width:90px">${escHtml(t.name)}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${state.students.map((s,i) => `
              <tr style="background:${i%2?'var(--surface)':'transparent'}">
                <td style="padding:8px 10px;position:sticky;left:0;background:${i%2?'var(--surface)':'var(--bg)'};font-size:12px;white-space:nowrap">
                  ${escHtml(s.name.split(' ')[0])}
                </td>
                ${state.tasks.map(t => {
                  const val = t.statuses[s.id]||t.statusOptions[0];
                  const sc = statusClass(val);
                  const colors = {'s-done':'#4cdf8e','s-absent':'#ff6b6b','s-partial':'#ffd166','s-excused':'#6c8eff','s-pending':'#8890b5'};
                  const c = colors[sc] || '#8890b5';
                  return `<td style="text-align:center;padding:6px">
                    <span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;color:${c};background:${c}22;border:1px solid ${c}44;white-space:nowrap">${escHtml(val)}</span>
                  </td>`;
                }).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      ` : ''}
    </div>
  `;
}

// ── MODAL ──
function openModal() { document.getElementById('modal-overlay').classList.add('open'); }
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

// ── HELPERS ──
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;'); }
function capitalize(s) { return s ? s.charAt(0).toUpperCase()+s.slice(1) : ''; }
function getOverallCompletion() {
  if (!state.tasks.length || !state.students.length) return 0;
  const pcts = state.tasks.map(t => {
    const doneOpts = t.statusOptions.filter(s => ['paid','present','submitted','done'].includes(s.toLowerCase()));
    const done = state.students.filter(s => doneOpts.includes(t.statuses[s.id]||t.statusOptions[0])).length;
    return state.students.length ? (done/state.students.length)*100 : 0;
  });
  return pcts.reduce((a,b)=>a+b,0)/pcts.length;
}

// expose to inline handlers
window.statusClass = statusClass;


// ── EXPORT ──
function openExportModal(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-title">Export Task Data</div>

    <div class="input-group">
      <label class="input-label">Select status to export</label>
      <select id="export-status">
        ${task.statusOptions.map(s => `<option value="${escAttr(s)}">${escHtml(s)}</option>`).join('')}
      </select>
    </div>

    <button class="btn btn-primary btn-full"
      onclick="exportTaskData('${task.id}')">
      Export to Excel
    </button>
  `;

  openModal();
}

function exportTaskData(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;

  const selectedStatus = document.getElementById('export-status').value;

  const rows = state.students
    .filter(s => (task.statuses[s.id] || task.statusOptions[0]) === selectedStatus)
    .map((s, index) => ({
      SNo: index + 1,
      Name: s.name,
      RegNumber: s.reg || '',
      Status: selectedStatus,
      Task: task.name,
      Type: task.type
    }));

  if (!rows.length) {
    toast('No students found with that status.');
    return;
  }

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, selectedStatus);

  const safeTask = task.name.replace(/[^a-z0-9]/gi, '_');
  const safeStatus = selectedStatus.replace(/[^a-z0-9]/gi, '_');

  XLSX.writeFile(wb, `${safeTask}_${safeStatus}.xlsx`);

  closeModal();
  toast(`Exported ${rows.length} students`);
}



// ── BACKUP SYSTEM ──
function exportBackup() {
  try {
    const backup = {
      version: 'classtrack_v1',
      exportedAt: new Date().toISOString(),
      data: state
    };

    const blob = new Blob(
      [JSON.stringify(backup, null, 2)],
      { type: 'application/json' }
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'classtrack-backup.json';

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);

    toast('Backup downloaded');
  } catch (err) {
    console.error(err);
    toast('Backup failed');
  }
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);

      if (!parsed || !parsed.data) {
        toast('Invalid backup file');
        return;
      }

      const imported = parsed.data;

      state = {
        students: Array.isArray(imported.students) ? imported.students : [],
        tasks: Array.isArray(imported.tasks) ? imported.tasks : []
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      openTasks.clear();

      renderRoster();
      renderTasks();
      renderOverview();
      updateHeaderMeta();

      toast('Full backup restored successfully');

      setTimeout(() => {
        showPage('roster');
      }, 150);

    } catch (err) {
      console.error(err);
      toast('Failed to restore backup');
    }
  };

  reader.readAsText(file);

  event.target.value = '';
}

// ── INIT ──
load();
showPage('roster');
</script>
